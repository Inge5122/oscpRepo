# Este archivo preseed instala Kali Linux versión "Full" (ISO por defecto) de forma desatendida y sin preguntas.
# Referencias útiles: people.debian.org/~plessy/DebianInstallerDebconfTemplates.html
# La red debe configurarse manualmente

# Configuración regional e idioma
d-i debian-installer/language string en
d-i debian-installer/country string US
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i clock-setup/utc boolean true
d-i time/zone string US/Central

# Configuración del servidor réplica (mirror)
d-i mirror/country string manual
d-i mirror/http/hostname string http.kali.org 
d-i mirror/http/directory string /kali 
d-i mirror/http/proxy string  
d-i mirror/suite string kali-rolling
d-i mirror/codename string kali-rolling

# d-i apt-setup/no_mirror boolean true
d-i apt-setup/use_mirror boolean false

# Deshabilitar volatile y security si no se desean actualizaciones
d-i apt-setup/services-select multiselect 

# Habilitar contrib y non-free
d-i apt-setup/main boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true

# Deshabilitar repositorios de código fuente
d-i apt-setup/enable-source-repositories boolean false

# Particionado
# El disco debe ser SCSI/SATA. Si es IDE o NVME, la cadena partman-auto/disk /dev/sda puede requerir ajuste (ej. nvme0n1)
# Recetas: atomic = todos los archivos en una partición ... home = /home separado ... multi = /home, /usr, /var y /tmp separados
d-i partman-auto/method string regular
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-auto/choose_recipe select atomic
d-i partman-auto/disk string /dev/sda
d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Añadir réplica propia de seguridad
d-i apt-setup/local0/repository string http://archive.kali.org/kali-security kali/updates main 
d-i apt-setup/local0/comment string Security updates 
d-i apt-setup/local0/source boolean false 

# Evitar mensajes de escaneo de otros DVDs
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false

# Selección de paquetes
tasksel tasksel/first multiselect standard 

# Paquetes adicionales individuales
d-i pkgsel/upgrade select full-upgrade 

# Nombre de host y dominio predeterminados
d-i netcfg/get_hostname string kali
d-i netcfg/get_domain string unassigned-domain 
d-i netcfg/hostname string kali

# Selección automática de interfaz de red
d-i netcfg/choose_interface select auto
d-i netcfg/dhcp_timeout string 10

d-i netcfg/dhcp_failed note
#d-i netcfg/dhcp_options select Do not configure the network at this time
d-i netcfg/dhcp_options select Configure network manually

# Omitir comprobación de ruta por defecto
d-i netcfg/no_default_route true

# Configuración de red estática (ejemplo)
#d-i netcfg/get_ipaddress string 192.168.1.42
#d-i netcfg/get_netmask string 255.255.255.0
#d-i netcfg/get_gateway string 192.168.1.1
#d-i netcfg/get_nameservers string 192.168.1.1
#d-i netcfg/confirm_static boolean true

# No crear cuenta de usuario estándar. Root habilitado con hash cifrado sha-512
d-i passwd/make-user boolean false
d-i passwd/root-login boolean true
d-i passwd/root-password-crypted password $6$IOvY3wv7$sG.bRzY2Pa6pxx9eiDazmn9pENtXDU9j1259N9bg.oOKiKZlGh97KxFG0fTQHcT3b7a2hTEGAaAkT3oDlsUGy0

# Deshabilitar participation en encuestas de popularidad
popularity-contest popularity-contest/participate boolean false 

# Instalador del gestor de arranque Grub
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string /dev/sda
d-i grub-installer/timeout string 0

# Servidor Samba y utilidades
samba-common samba-common/dhcp boolean false

# Wireshark
wireshark-common wireshark-common/install-setuid boolean false

# Evitar mensaje final sobre instalación completa
d-i finish-install/reboot_in_progress note
