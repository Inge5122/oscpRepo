# /etc/systemd/system/ollama.service.d/override.conf
# Ajustes del servidor Ollama para RTX 3050 Ti (4 GB VRAM) + 14 GB RAM.
# Instalar con:  sudo ./ia_local/setup_ollama.sh --systemd

[Service]
# Interfaz de escucha: solo loopback. La API de Ollama NO tiene autenticación;
# con 0.0.0.0 (valor anterior) quedaba expuesta a toda la red, incluidas las VMs
# vulnerables del laboratorio. Política de privacidad de telemetría, sección 5.
# Si algún día necesitas acceso remoto, usa un túnel SSH (ssh -L 11434:127.0.0.1:11434)
# en lugar de volver a 0.0.0.0.
Environment="OLLAMA_HOST=127.0.0.1:11434"

# Flash Attention: reduce el consumo de memoria de la atención y es requisito
# para cuantizar la KV cache.
Environment="OLLAMA_FLASH_ATTENTION=1"

# KV cache en 8 bits: ~mitad de VRAM para el contexto con pérdida de calidad
# despreciable. Es lo que permite 8K de contexto con qwen3:4b 100% en GPU.
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"

# Solo un modelo cargado a la vez: 4 GB de VRAM no alcanzan para dos.
# Al pasar de soc-triage a soc-analista, Ollama descarga el anterior.
Environment="OLLAMA_MAX_LOADED_MODELS=1"

# Una petición a la vez por modelo: cada slot paralelo multiplica la KV cache.
# El pipeline debe encolar las alertas en lugar de enviarlas en paralelo.
Environment="OLLAMA_NUM_PARALLEL=1"

# Mantener el modelo cargado 10 min tras la última petición (evita recargas
# de varios segundos entre alertas consecutivas).
Environment="OLLAMA_KEEP_ALIVE=10m"
